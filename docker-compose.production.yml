version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: 3dvc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: threedvc
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: threedvc_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threedvc"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: 3dvc-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: 3dvc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: 3dvc-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --port 7880
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:8080/udp"

  gpu-worker:
    build:
      context: ./backend
      dockerfile: ../docker/gpu-worker.Dockerfile
    container_name: 3dvc-gpu-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: 3dvc-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: 3dvc-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    container_name: 3dvc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
